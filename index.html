<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reome Inmobiliaria</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Inter"', 'sans-serif'], }
        }
      }
    }
  </script>
  <style>
    .menu-activo { background-color: #111827; color: white; border-color: #111827; }
    html { scroll-behavior: smooth; }
    .fade-in-up { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease-out, transform 0.6s ease-out; }
    .fade-in-up.visible { opacity: 1; transform: translateY(0); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col antialiased">
  
  <!-- BARRA DE NAVEGACIÓN -->
  <nav class="bg-white py-4 px-6 md:px-12 flex flex-row justify-between items-center sticky top-0 z-50">
    <div class="text-xl font-bold tracking-tight cursor-pointer flex items-center gap-2" onclick="cerrarDetalle(); window.scrollTo(0,0)">
      <div class="w-6 h-6 bg-black text-white rounded-full flex items-center justify-center text-xs"><i class="fa-solid fa-home"></i></div>
      Reome
    </div>
    
    <div class="hidden md:flex gap-8 text-sm font-medium text-gray-600">
      <a href="#" onclick="cerrarDetalle(); window.scrollTo(0,0)" class="hover:text-black">Inicio</a>
      <a href="#seccion-catalogo" onclick="cerrarDetalle()" class="hover:text-black">Propiedades</a>
    </div>

    <a href="https://wa.me/543755658084" target="_blank" class="bg-black hover:bg-gray-800 text-white text-sm font-semibold py-2 px-5 rounded-full transition flex items-center gap-2">
      Contactar <i class="fa-brands fa-whatsapp"></i>
    </a>
  </nav>

  <!-- SECCIÓN PRINCIPAL -->
  <div id="seccion-principal" class="flex flex-col w-full">
    
    <!-- HERO SECTION CON BUSCADOR FLOTANTE -->
    <header class="relative w-full h-[60vh] md:h-[70vh] px-4 md:px-12 pt-6">
      <div class="w-full h-full relative rounded-3xl overflow-hidden shadow-sm">
        <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=1600&q=80" class="w-full h-full object-cover">
        <!-- Overlay oscuro suave para que el texto resalte -->
        <div class="absolute inset-0 bg-black/30"></div>
        
        <div class="absolute inset-0 flex flex-col items-center justify-center text-white px-4">
          <h1 class="text-4xl md:text-6xl lg:text-7xl font-bold text-center mb-4 leading-tight tracking-tight">Browse Homes, Apartments<br>& Rentals with Ease</h1>
        </div>
      </div>

      <!-- Buscador Flotante Estilo Píldora -->
      <div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 translate-y-1/2 w-[90%] max-w-4xl z-20">
        <div class="bg-white rounded-full shadow-xl p-2 pl-6 flex items-center justify-between border border-gray-100">
          <div class="flex items-center gap-3 flex-1">
            <i class="fa-solid fa-search text-gray-400"></i>
            <input type="text" id="buscador" onkeyup="buscarProducto()" placeholder="Buscar por barrio, casa, lote..." class="w-full bg-transparent text-gray-900 focus:outline-none text-sm md:text-base placeholder-gray-400 font-medium">
          </div>
          <button class="bg-black text-white px-6 py-3 rounded-full text-sm font-bold ml-4 hover:bg-gray-800 transition">Buscar</button>
        </div>
      </div>
    </header>

    <main id="seccion-catalogo" class="pt-24 pb-20 px-6 md:px-12">
      <div class="text-center mb-12">
        <h2 id="titulo-categoria" class="text-3xl font-bold capitalize mb-8 tracking-tight">Brome the Startss</h2>
        
        <!-- Categorías Estilo Píldora -->
        <div id="menu-categorias" class="flex flex-wrap justify-center gap-3"></div>
      </div>

      <!-- Grilla de Tarjetas Minimalistas -->
      <div id="grilla-productos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-12 max-w-7xl mx-auto">
        <p class="text-center w-full col-span-full py-10 text-gray-500"><i class="fa-solid fa-spinner fa-spin text-black text-2xl mb-2"></i><br>Cargando propiedades...</p>
      </div>
    </main>
    
    <footer class="bg-white py-8 text-center border-t border-gray-200 mt-auto">
      <p class="text-gray-400 text-xs font-semibold uppercase tracking-widest">&copy; Reome Inmobiliaria</p>
    </footer>
  </div>


  <!-- VISTA SPA: DETALLE DE PROPIEDAD -->
  <div id="vista-detalle" class="hidden flex-col w-full bg-gray-50 pb-20">
    <div class="max-w-7xl mx-auto w-full px-4 sm:px-6 md:px-12 py-10">
      
      <button onclick="cerrarDetalle()" class="text-gray-500 hover:text-black mb-8 flex items-center gap-2 transition font-bold uppercase tracking-widest text-xs bg-white px-4 py-2 rounded-full shadow-sm border border-gray-200 inline-flex">
        <i class="fa-solid fa-arrow-left"></i> Volver al Catálogo
      </button>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
        
        <div class="lg:col-span-2 flex flex-col gap-4">
          <div class="w-full aspect-[4/3] rounded-3xl overflow-hidden shadow-sm bg-gray-200 relative">
            <img id="detalle-img-main" src="" class="w-full h-full object-cover transition-opacity duration-300">
          </div>
          <div id="detalle-galeria" class="flex gap-4 overflow-x-auto pb-2 no-scrollbar">
            <!-- JS lo llena -->
          </div>
        </div>

        <div class="flex flex-col">
          <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 sticky top-24">
            <span class="text-gray-500 font-bold text-[10px] tracking-widest uppercase mb-2 block" id="detalle-cat">Categoría</span>
            <h1 class="text-3xl font-bold text-gray-900 mb-6 leading-tight" id="detalle-titulo">Título Propiedad</h1>
            
            <div class="pb-6 mb-6 border-b border-gray-100">
              <p class="text-sm text-gray-500 mb-1 font-medium">Precio de lista</p>
              <p class="text-3xl font-bold text-black" id="detalle-precio"></p>
            </div>

            <h3 class="text-sm font-bold text-gray-900 mb-3 uppercase tracking-wide">Descripción</h3>
            <p class="text-gray-500 mb-8 whitespace-pre-wrap leading-relaxed text-sm" id="detalle-desc"></p>

            <a id="detalle-wsp" href="#" target="_blank" class="w-full bg-black hover:bg-gray-800 text-white font-bold py-4 rounded-full transition text-sm flex justify-center items-center gap-2 shadow-md">
              Contactar Asesor <i class="fa-brands fa-whatsapp text-lg"></i>
            </a>
          </div>
        </div>
      </div>

      <div id="contenedor-mapa-cliente" class="mt-12 bg-white p-8 rounded-3xl shadow-sm border border-gray-100 hidden">
        <h3 class="text-xl font-bold text-gray-900 mb-6">Ubicación en el Mapa</h3>
        <div id="mapa-cliente" class="w-full h-80 md:h-96 rounded-2xl overflow-hidden border border-gray-200 z-10"></div>
      </div>

    </div>
  </div>


  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAHEemfeOAbqn8zwcJIQMgPCWoj-rieWjo",
      authDomain: "tio-juanjo.firebaseapp.com",
      projectId: "tio-juanjo",
      storageBucket: "tio-juanjo.firebasestorage.app",
      messagingSenderId: "465060896072",
      appId: "1:465060896072:web:d96cafe70ef8afd56e677d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let productos = [];
    let categorias = [];
    let mapaCliente = null; 
    let markerCliente = null;

    const observador = new IntersectionObserver((entradas) => {
      entradas.forEach(entrada => { if (entrada.isIntersecting) { entrada.target.classList.add('visible'); } });
    }, { threshold: 0.1 });

    async function cargarDatos() {
      const catSnap = await getDocs(collection(db, "categorias_inmuebles"));
      catSnap.forEach((doc) => { categorias.push({ id: doc.id, ...doc.data() }); });
      
      const prodSnap = await getDocs(collection(db, "inmuebles"));
      prodSnap.forEach((doc) => { productos.push({ id: doc.id, ...doc.data() }); });
      
      renderizarMenu(); filtrar('todos');
    }

    function renderizarMenu() {
      const menu = document.getElementById("menu-categorias");
      menu.innerHTML = `<button onclick="filtrar('todos')" class="menu-btn menu-activo px-6 py-2 rounded-full border border-gray-200 text-sm font-medium transition hover:bg-gray-100">Todo</button>`;
      const catVisibles = categorias.filter(cat => !cat.oculta);
      catVisibles.forEach(cat => {
        menu.innerHTML += `<button onclick="filtrar('${cat.nombre}')" class="menu-btn px-6 py-2 rounded-full border border-gray-200 text-sm font-medium text-gray-600 transition hover:bg-gray-100">${cat.nombre}</button>`;
      });
    }

    window.buscarProducto = function() {
      const texto = document.getElementById("buscador").value.toLowerCase();
      document.querySelectorAll(".menu-btn").forEach(btn => btn.classList.remove("menu-activo"));
      if(texto === "") {
        if(document.querySelectorAll(".menu-btn").length > 0) document.querySelectorAll(".menu-btn")[0].classList.add("menu-activo");
      }
      const noms = categorias.filter(c => !c.oculta).map(c => c.nombre.toLowerCase());
      const perms = productos.filter(p => noms.includes(p.categoria.toLowerCase()));
      const filtrados = perms.filter(p => p.nombre.toLowerCase().includes(texto) || p.descripcion.toLowerCase().includes(texto));
      renderizarProductos(filtrados);
    }

    window.filtrar = function(catNombre) {
      document.getElementById("buscador").value = ""; 
      document.querySelectorAll(".menu-btn").forEach(btn => {
        btn.classList.remove("menu-activo");
        if (catNombre === "todos" && btn.innerText.toLowerCase() === "todo") btn.classList.add("menu-activo");
        else if (btn.innerText.toLowerCase() === catNombre.toLowerCase()) btn.classList.add("menu-activo");
      });
      const noms = categorias.filter(c => !c.oculta).map(c => c.nombre.toLowerCase());
      const perms = productos.filter(p => noms.includes(p.categoria.toLowerCase()));
      const filtrados = catNombre === "todos" ? perms : perms.filter(p => p.categoria.toLowerCase() === catNombre.toLowerCase());
      renderizarProductos(filtrados);
    }

    function renderizarProductos(items) {
      const grilla = document.getElementById("grilla-productos"); grilla.innerHTML = "";
      if (items.length === 0) { grilla.innerHTML = `<p class="text-gray-500 text-center col-span-full py-10">No se encontraron resultados.</p>`; return; }
      
      items.forEach(prod => {
        const tarjeta = document.createElement('div');
        tarjeta.className = "fade-in-up bg-white rounded-xl shadow-sm hover:shadow-md transition cursor-pointer group flex flex-col overflow-hidden";
        tarjeta.onclick = () => window.abrirDetalle(prod.id);
        
        const tieneGaleria = (prod.galeria && prod.galeria.length > 0) ? `<div class="absolute top-3 right-3 bg-white/90 text-black rounded-full px-2 py-1 text-[10px] backdrop-blur-sm z-10 font-bold shadow-sm"><i class="fa-solid fa-images"></i> +${prod.galeria.length}</div>` : '';
        const indicadorMapa = (prod.lat && prod.lng) ? `<div class="text-gray-400 text-xs mt-1 flex items-center gap-1"><i class="fa-solid fa-location-dot"></i> Ver en mapa</div>` : '';
        const precioMostrado = prod.precio ? `$${prod.precio}` : 'Consultar';

        tarjeta.innerHTML = `
          <div class="w-full aspect-[4/3] relative overflow-hidden bg-gray-100 p-2">
            <img src="${prod.imagen}" loading="lazy" class="w-full h-full object-cover rounded-lg group-hover:scale-105 transition duration-500">
            ${tieneGaleria}
          </div>
          <div class="pt-4 pb-2 px-1 flex justify-between items-start">
            <div class="flex-1 pr-4">
              <h3 class="font-bold text-gray-900 text-lg leading-tight group-hover:text-black transition line-clamp-1">${prod.nombre}</h3>
              <p class="text-gray-400 text-sm mt-1 line-clamp-1">${prod.categoria}</p>
              ${indicadorMapa}
            </div>
            <div class="text-right shrink-0">
              <p class="text-black font-bold text-lg">${precioMostrado}</p>
            </div>
          </div>
        `;
        grilla.appendChild(tarjeta); observador.observe(tarjeta);
      });
    }

    window.cambiarFotoDetalle = function(url) {
      const imgContenedor = document.getElementById('detalle-img-main');
      imgContenedor.style.opacity = '0.4';
      setTimeout(() => { imgContenedor.src = url; imgContenedor.style.opacity = '1'; }, 150);
    }

    window.abrirDetalle = function(id) {
      const prod = productos.find(p => p.id === id); if (!prod) return;

      document.getElementById('seccion-principal').classList.add('hidden');
      document.getElementById('vista-detalle').classList.remove('hidden');
      document.getElementById('vista-detalle').classList.add('flex');
      window.scrollTo(0,0);

      document.getElementById('detalle-cat').innerText = prod.categoria;
      document.getElementById('detalle-titulo').innerText = prod.nombre;
      document.getElementById('detalle-precio').innerText = prod.precio ? `$ ${prod.precio}` : 'Consultar';
      document.getElementById('detalle-desc').innerText = prod.descripcion;
      
      const textoWsp = `Hola! Me gustaría consultar por la propiedad: ${prod.nombre}`;
      document.getElementById('detalle-wsp').href = `https://wa.me/543755658084?text=${encodeURIComponent(textoWsp)}`;

      const todasLasFotos = [prod.imagen, ...(prod.galeria || [])];
      const fotosUnicas = [...new Set(todasLasFotos)];
      
      document.getElementById('detalle-img-main').src = fotosUnicas[0];
      const galeriaContenedor = document.getElementById('detalle-galeria'); galeriaContenedor.innerHTML = "";
      
      if (fotosUnicas.length > 1) {
        fotosUnicas.forEach(url => {
          galeriaContenedor.innerHTML += `
            <div onclick="cambiarFotoDetalle('${url}')" class="w-24 h-24 shrink-0 rounded-2xl overflow-hidden border border-gray-200 cursor-pointer hover:opacity-80 transition bg-gray-100">
              <img src="${url}" class="w-full h-full object-cover">
            </div>`;
        });
      }

      const divMapa = document.getElementById('contenedor-mapa-cliente');
      if (prod.lat && prod.lng) {
        divMapa.classList.remove('hidden');
        setTimeout(() => {
          if(!mapaCliente) {
            mapaCliente = L.map('mapa-cliente').setView([prod.lat, prod.lng], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapaCliente);
            markerCliente = L.marker([prod.lat, prod.lng]).addTo(mapaCliente);
          } else {
            mapaCliente.setView([prod.lat, prod.lng], 16);
            if(markerCliente) mapaCliente.removeLayer(markerCliente);
            markerCliente = L.marker([prod.lat, prod.lng]).addTo(mapaCliente);
          }
          mapaCliente.invalidateSize();
        }, 100);
      } else { divMapa.classList.add('hidden'); }
    }

    window.cerrarDetalle = function() {
      document.getElementById('vista-detalle').classList.add('hidden');
      document.getElementById('vista-detalle').classList.remove('flex');
      document.getElementById('seccion-principal').classList.remove('hidden');
    }

    cargarDatos();
  </script>
</body>
</html>
