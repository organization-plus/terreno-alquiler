<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hasan y asociados — Estudio Jurídico</title>
  
  <link rel="preconnect" href="https://i.ibb.co" crossorigin>
  <link rel="dns-prefetch" href="https://i.ibb.co">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- CONFIGURACIÓN ESTRICTA CON TU PALETA DE COLORES -->
  <script>
    tailwind.config = { 
      theme: { 
        extend: { 
          colors: {
            midnight: '#1C2E4A',
            dusty: '#52677D',
            ivory: '#BDC4D4',
            deep: '#0F1A2B',
            butter: '#D1CFC9'
          },
          fontFamily: { sans: ['"Inter"', 'sans-serif'], } 
        } 
      } 
    }
  </script>
  <style>
    html { scroll-behavior: smooth; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

<!-- FONDO GLOBAL BUTTERCREAM -->
<body class="font-sans text-deep antialiased bg-butter min-h-screen">

  <!-- VISTA PRINCIPAL (CATÁLOGO) -->
  <main id="seccion-principal" class="relative z-10 min-h-screen">
    
    <div class="relative z-10">
      
      <!-- Navbar (Fondo Ivory) -->
      <header class="sticky top-0 z-50 w-full border-b border-dusty/30 bg-ivory/90 backdrop-blur-md shadow-sm">
        <nav class="mx-auto flex h-16 max-w-7xl items-center justify-end px-6">
          <a href="https://wa.me/543755658084" target="_blank" class="flex items-center gap-2 rounded-full bg-deep px-5 py-2.5 text-sm font-medium text-butter transition-colors hover:bg-midnight shadow-md">
            <i class="fa-brands fa-whatsapp text-lg"></i> Contacto
          </a>
        </nav>
      </header>

      <!-- Hero Section -->
      <section class="mx-auto max-w-7xl px-6 pb-16 pt-24 sm:pt-32">
        <div class="flex flex-col items-center text-center relative z-20">
          <p class="mb-5 text-sm font-bold uppercase tracking-[0.2em] text-dusty bg-ivory/80 px-4 py-1 rounded-full border border-dusty/30 backdrop-blur-sm">Estudio Jurídico</p>
          <h1 class="max-w-4xl text-balance text-5xl font-bold leading-tight tracking-tight text-deep sm:text-6xl lg:text-7xl drop-shadow-sm">
            Hasan y asociados
          </h1>
          <p class="mt-6 max-w-xl text-pretty text-base md:text-lg leading-relaxed text-midnight font-medium">
            Asesoramiento legal integral en materia inmobiliaria, terrenos y alquileres.
          </p>

          <!-- Buscador flotante -->
          <div class="mt-12 w-full max-w-2xl">
            <div class="flex items-center gap-2 rounded-full bg-ivory backdrop-blur-md p-2 shadow-xl shadow-deep/10 ring-1 ring-dusty/40 transition-all focus-within:shadow-2xl focus-within:ring-dusty">
              <div class="flex flex-1 items-center gap-3 pl-4">
                <i class="fa-solid fa-search text-dusty"></i>
                <input type="text" id="buscador" onkeyup="buscarProducto()" placeholder="Buscar por ciudad, dirección o zona" class="w-full bg-transparent py-2 text-sm text-deep placeholder:text-dusty focus:outline-none font-medium" />
              </div>
              <button onclick="buscarProducto()" class="shrink-0 rounded-full bg-deep px-8 py-3 text-sm font-bold text-butter transition-all hover:bg-midnight hover:scale-105 shadow-md">Buscar</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Grilla de Propiedades -->
      <section class="mx-auto max-w-7xl px-6 pb-24 pt-12 relative z-20">
        <!-- Filtros -->
        <div class="mb-12 flex flex-wrap justify-center gap-3" id="menu-categorias"></div>

        <div id="grilla-productos" class="grid grid-cols-1 gap-x-8 gap-y-12 sm:grid-cols-2 lg:grid-cols-3">
          <!-- Skeleton Loaders -->
          <article class="rounded-3xl bg-ivory p-3 shadow-md border border-dusty/20 animate-pulse"><div class="aspect-[4/3] rounded-2xl bg-dusty/20"></div><div class="px-2 pb-2 pt-4"><div class="h-4 bg-dusty/20 rounded w-1/2 mb-3"></div><div class="h-6 bg-dusty/20 rounded w-1/3"></div></div></article>
          <article class="rounded-3xl bg-ivory p-3 shadow-md border border-dusty/20 animate-pulse hidden sm:block"><div class="aspect-[4/3] rounded-2xl bg-dusty/20"></div><div class="px-2 pb-2 pt-4"><div class="h-4 bg-dusty/20 rounded w-1/2 mb-3"></div><div class="h-6 bg-dusty/20 rounded w-1/3"></div></div></article>
          <article class="rounded-3xl bg-ivory p-3 shadow-md border border-dusty/20 animate-pulse hidden lg:block"><div class="aspect-[4/3] rounded-2xl bg-dusty/20"></div><div class="px-2 pb-2 pt-4"><div class="h-4 bg-dusty/20 rounded w-1/2 mb-3"></div><div class="h-6 bg-dusty/20 rounded w-1/3"></div></div></article>
        </div>
      </section>
    </div>
  </main>


  <!-- VISTA DETALLE DE PROPIEDAD -->
  <div id="vista-detalle" class="hidden relative z-10 min-h-screen pb-24 bg-butter">
    <!-- Navbar simple para detalle -->
    <header class="sticky top-0 z-50 w-full border-b border-dusty/30 bg-ivory/90 backdrop-blur-md shadow-sm">
      <nav class="mx-auto flex h-16 max-w-5xl items-center px-4 sm:px-6">
        <button onclick="cerrarDetalle()" class="inline-flex items-center gap-2 rounded-full bg-ivory px-5 py-2.5 text-sm font-bold text-midnight shadow-sm ring-1 ring-dusty/40 transition-all hover:bg-dusty hover:text-butter">
          <i class="fa-solid fa-arrow-left"></i> Volver al catálogo
        </button>
      </nav>
    </header>

    <div class="mx-auto max-w-5xl px-4 pt-8 sm:px-6">
      
      <!-- Título y precio -->
      <div class="mt-2 bg-ivory/95 backdrop-blur-sm p-6 md:p-8 rounded-3xl shadow-sm border border-dusty/30">
        <span id="detalle-cat" class="text-xs font-bold uppercase tracking-[0.15em] text-dusty bg-butter px-3 py-1 rounded-full">Categoría</span>
        <h1 id="detalle-titulo" class="mt-4 text-balance text-3xl font-bold leading-tight tracking-tight text-deep sm:text-4xl md:text-5xl">Título</h1>
        <p id="detalle-precio" class="mt-4 text-3xl font-bold tracking-tight text-deep border-t border-dusty/20 pt-4">$0</p>
      </div>

      <div class="mt-8 lg:grid lg:grid-cols-[1.4fr_1fr] lg:gap-10 items-start">
        <!-- Columna izquierda: fotos + mapa -->
        <div class="flex flex-col gap-8">
          
          <div class="bg-ivory/95 backdrop-blur-sm p-3 rounded-3xl shadow-sm border border-dusty/30">
            <!-- Foto principal -->
            <div class="aspect-[4/3] overflow-hidden rounded-2xl bg-dusty/20 relative">
              <img id="detalle-img-main" src="" alt="Vista principal" class="h-full w-full object-cover transition-opacity duration-300">
            </div>
            <!-- Miniaturas deslizables -->
            <div id="detalle-galeria" class="mt-3 flex gap-3 overflow-x-auto pb-2 no-scrollbar"></div>
          </div>

          <!-- Descripción -->
          <div class="bg-ivory/95 backdrop-blur-sm p-6 md:p-8 rounded-3xl shadow-sm border border-dusty/30">
            <h2 class="text-xl font-bold tracking-tight text-deep mb-4 flex items-center gap-2"><i class="fa-solid fa-align-left text-dusty"></i> Detalles de la propiedad</h2>
            <p id="detalle-desc" class="text-base leading-relaxed text-midnight whitespace-pre-wrap break-words"></p>
          </div>

          <!-- Mapa -->
          <div id="contenedor-mapa-cliente" class="hidden bg-ivory/95 backdrop-blur-sm p-6 md:p-8 rounded-3xl shadow-sm border border-dusty/30">
            <h2 class="text-xl font-bold tracking-tight text-deep mb-4 flex items-center gap-2"><i class="fa-solid fa-map-location-dot text-dusty"></i> Ubicación</h2>
            <div id="mapa-cliente" class="flex aspect-[16/9] w-full rounded-2xl bg-dusty/20 overflow-hidden ring-1 ring-dusty/30 z-10"></div>
          </div>
        </div>

        <!-- Columna derecha: Tarjeta flotante de contacto (Desktop) -->
        <div class="mt-8 lg:mt-0">
          <div class="rounded-3xl bg-ivory/95 backdrop-blur-sm p-8 shadow-xl shadow-deep/5 border border-dusty/30 lg:sticky lg:top-24 text-center">
            
            <p class="text-base font-medium leading-relaxed text-midnight mb-8">
              ¿Te interesa? Escribinos y te asesoramos.
            </p>
            
            <a id="detalle-wsp-desktop" href="#" target="_blank" class="hidden w-full items-center justify-center gap-3 rounded-full bg-deep px-6 py-4 text-sm font-bold text-butter transition-all hover:bg-midnight hover:-translate-y-1 shadow-lg lg:flex">
              <i class="fa-brands fa-whatsapp text-xl"></i> Contactar al Estudio
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Botón de contacto fijo en móvil (Bottom bar) -->
    <div class="fixed inset-x-0 bottom-0 z-50 border-t border-dusty/30 bg-ivory/95 p-4 backdrop-blur-md lg:hidden shadow-[0_-10px_40px_rgba(15,26,43,0.1)]">
      <a id="detalle-wsp-mobile" href="#" target="_blank" class="flex w-full items-center justify-center gap-3 rounded-full bg-deep px-6 py-4 text-base font-bold text-butter transition-colors hover:bg-midnight shadow-xl">
        <i class="fa-brands fa-whatsapp text-2xl"></i> Escribinos por WhatsApp
      </a>
    </div>
  </div>


  <!-- Modal de Anuncio -->
  <div id="modal-anuncio" class="fixed inset-0 bg-deep/70 backdrop-blur-sm hidden items-center justify-center p-4 z-[60] transition-opacity">
    <div class="bg-ivory w-full max-w-lg mx-auto rounded-3xl overflow-hidden shadow-2xl relative flex flex-col min-h-[300px] border border-dusty/40">
      <div id="anuncio-bg" class="absolute inset-0 z-0 opacity-20 bg-cover bg-center"></div>
      <div class="relative z-10 p-10 flex flex-col items-center text-center h-full justify-center">
        <button onclick="cerrarAnuncio()" class="absolute top-4 right-4 text-dusty hover:text-deep transition bg-butter rounded-full w-8 h-8 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
        <h3 id="anuncio-titulo" class="text-3xl font-bold text-deep mb-4 tracking-tight leading-tight"></h3>
        <p id="anuncio-texto" class="text-midnight text-base md:text-lg leading-relaxed whitespace-pre-wrap break-words mb-4 font-medium"></p>
        <button onclick="cerrarAnuncio()" class="mt-6 bg-deep hover:bg-midnight text-butter font-bold py-3 px-10 rounded-full transition text-sm shadow-md">Entendido</button>
      </div>
    </div>
  </div>


  <!-- LÓGICA FUNCIONAL FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAHEemfeOAbqn8zwcJIQMgPCWoj-rieWjo",
      authDomain: "tio-juanjo.firebaseapp.com",
      projectId: "tio-juanjo",
      storageBucket: "tio-juanjo.firebasestorage.app",
      messagingSenderId: "465060896072",
      appId: "1:465060896072:web:d96cafe70ef8afd56e677d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let productos = []; let categorias = []; let mapaCliente = null; let markerCliente = null;
    let fotosUnicasActuales = [];

    async function cargarDatos() {
      const catSnap = await getDocs(collection(db, "categorias_inmuebles"));
      catSnap.forEach((doc) => { categorias.push({ id: doc.id, ...doc.data() }); });
      
      const prodSnap = await getDocs(collection(db, "inmuebles"));
      prodSnap.forEach((doc) => { productos.push({ id: doc.id, ...doc.data() }); });
      
      renderizarMenu(); filtrar('todo'); cargarAnuncio();
    }

    async function cargarAnuncio() {
      if (sessionStorage.getItem("anuncioVisto_inm")) return;
      try {
        const docSnap = await getDoc(doc(db, "configuracion_inmuebles", "anuncio"));
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.activo) {
            document.getElementById('anuncio-titulo').innerText = data.titulo;
            document.getElementById('anuncio-texto').innerText = data.texto;
            if (data.imagen) document.getElementById('anuncio-bg').style.backgroundImage = `url('${data.imagen}')`;
            document.getElementById('modal-anuncio').classList.remove('hidden'); document.getElementById('modal-anuncio').classList.add('flex');
          }
        }
      } catch (e) {}
    }

    window.cerrarAnuncio = function() {
      document.getElementById('modal-anuncio').classList.add('hidden'); document.getElementById('modal-anuncio').classList.remove('flex');
      sessionStorage.setItem("anuncioVisto_inm", "true");
    }

    function renderizarMenu() {
      const menu = document.getElementById("menu-categorias");
      menu.innerHTML = `<button onclick="filtrar('todo')" class="filter-btn rounded-full bg-deep px-6 py-2.5 text-sm font-bold text-butter transition-all shadow-md" data-filter="todo">Todo</button>`;
      const catVisibles = categorias.filter(cat => !cat.oculta);
      catVisibles.forEach(cat => {
        menu.innerHTML += `<button onclick="filtrar('${cat.nombre}')" class="filter-btn rounded-full bg-ivory/80 backdrop-blur-sm px-6 py-2.5 text-sm font-medium text-midnight shadow-sm transition-all hover:bg-dusty hover:text-butter ring-1 ring-dusty/40" data-filter="${cat.nombre}">${cat.nombre}</button>`;
      });
    }

    function obtenerProductosVisibles() {
      const noms = categorias.filter(c => !c.oculta).map(c => c.nombre.toLowerCase());
      return productos.filter(p => noms.includes(p.categoria.toLowerCase()) && !p.oculta);
    }

    window.buscarProducto = function() {
      const texto = document.getElementById("buscador").value.toLowerCase();
      
      if(texto === "") {
        filtrar('todo');
        return;
      }
      
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.className = 'filter-btn rounded-full bg-ivory/80 backdrop-blur-sm px-6 py-2.5 text-sm font-medium text-midnight shadow-sm transition-all hover:bg-dusty hover:text-butter ring-1 ring-dusty/40';
      });

      const perms = obtenerProductosVisibles();
      const filtrados = perms.filter(p => p.nombre.toLowerCase().includes(texto) || p.descripcion.toLowerCase().includes(texto) || p.categoria.toLowerCase().includes(texto));
      renderizarProductos(filtrados);
    }

    window.filtrar = function(catNombre) {
      document.getElementById("buscador").value = ""; 
      
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if(btn.dataset.filter.toLowerCase() === catNombre.toLowerCase()) {
          btn.className = 'filter-btn rounded-full bg-deep px-6 py-2.5 text-sm font-bold text-butter transition-all shadow-md';
        } else {
          btn.className = 'filter-btn rounded-full bg-ivory/80 backdrop-blur-sm px-6 py-2.5 text-sm font-medium text-midnight shadow-sm transition-all hover:bg-dusty hover:text-butter ring-1 ring-dusty/40';
        }
      });

      const perms = obtenerProductosVisibles();
      const filtrados = catNombre.toLowerCase() === "todo" ? perms : perms.filter(p => p.categoria.toLowerCase() === catNombre.toLowerCase());
      renderizarProductos(filtrados);
    }

    function renderizarProductos(items) {
      const grilla = document.getElementById("grilla-productos"); grilla.innerHTML = "";
      if (items.length === 0) { grilla.innerHTML = `<div class="col-span-full text-center py-20 bg-ivory rounded-3xl border border-dusty/30 backdrop-blur-sm"><i class="fa-solid fa-house-circle-exclamation text-4xl text-dusty mb-3"></i><p class="text-midnight font-medium">No se encontraron propiedades.</p></div>`; return; }
      
      items.forEach((prod, index) => {
        const tarjeta = document.createElement('article');
        tarjeta.className = "group cursor-pointer rounded-3xl bg-ivory backdrop-blur-sm p-3 shadow-md shadow-deep/5 ring-1 ring-dusty/30 transition-all duration-300 hover:-translate-y-2 hover:shadow-xl flex flex-col";
        tarjeta.onclick = () => window.abrirDetalle(prod.id);
        
        const precioMostrado = prod.precio ? `$${prod.precio}` : 'Consultar';
        const atributosImagen = index < 6 ? 'fetchpriority="high"' : 'loading="lazy"';
        const indicadorGaleria = (prod.galeria && prod.galeria.length > 0) ? `<div class="absolute top-3 right-3 rounded-full bg-ivory/95 px-3 py-1.5 text-[10px] font-bold text-deep shadow-sm backdrop-blur-sm flex items-center gap-1"><i class="fa-solid fa-images"></i> +${prod.galeria.length}</div>` : '';

        tarjeta.innerHTML = `
          <div class="aspect-[4/3] overflow-hidden rounded-2xl bg-dusty/20 relative">
            <img src="${prod.imagen}" ${atributosImagen} alt="${prod.nombre}" class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-110" />
            ${indicadorGaleria}
          </div>
          <div class="px-3 pb-3 pt-5 flex-1 flex flex-col">
            <span class="text-[10px] font-bold uppercase tracking-widest text-dusty mb-2">${prod.categoria}</span>
            <h3 class="text-xl font-bold tracking-tight text-deep leading-tight line-clamp-2">${prod.nombre}</h3>
            <p class="mt-auto pt-4 text-2xl font-black tracking-tight text-deep">${precioMostrado}</p>
          </div>
        `;
        grilla.appendChild(tarjeta);
      });
    }

    window.cambiarFotoDetalle = function(url, indexBoton) {
      const imgContenedor = document.getElementById('detalle-img-main');
      imgContenedor.style.opacity = '0.4';
      setTimeout(() => { imgContenedor.src = url; imgContenedor.style.opacity = '1'; }, 150);
      
      document.querySelectorAll('.btn-miniatura').forEach((btn, i) => {
        if(i === indexBoton) {
          btn.classList.remove('ring-1', 'ring-dusty/50', 'opacity-70'); btn.classList.add('ring-2', 'ring-deep', 'opacity-100');
        } else {
          btn.classList.remove('ring-2', 'ring-deep', 'opacity-100'); btn.classList.add('ring-1', 'ring-dusty/50', 'opacity-70');
        }
      });
    }

    window.abrirDetalle = function(id) {
      const prod = productos.find(p => p.id === id); if (!prod) return;

      document.getElementById('seccion-principal').classList.add('hidden');
      document.getElementById('vista-detalle').classList.remove('hidden');
      document.getElementById('vista-detalle').classList.add('block');
      window.scrollTo(0,0);

      document.getElementById('detalle-cat').innerText = prod.categoria;
      document.getElementById('detalle-titulo').innerText = prod.nombre;
      document.getElementById('detalle-precio').innerText = prod.precio ? `$ ${prod.precio}` : 'Consultar';
      document.getElementById('detalle-desc').innerText = prod.descripcion;
      
      const textoWsp = `Hola Estudio Hasan y Asociados! Me gustaría consultar por la propiedad: ${prod.nombre}`;
      const linkWsp = `https://wa.me/543755658084?text=${encodeURIComponent(textoWsp)}`;
      document.getElementById('detalle-wsp-desktop').href = linkWsp;
      document.getElementById('detalle-wsp-mobile').href = linkWsp;

      const todasLasFotos = [prod.imagen, ...(prod.galeria || [])];
      fotosUnicasActuales = [...new Set(todasLasFotos)];
      
      document.getElementById('detalle-img-main').src = fotosUnicasActuales[0];
      const galeriaContenedor = document.getElementById('detalle-galeria'); galeriaContenedor.innerHTML = "";
      
      if (fotosUnicasActuales.length > 1) {
        fotosUnicasActuales.forEach((url, i) => {
          const clasesEstado = i === 0 ? "ring-2 ring-deep opacity-100" : "ring-1 ring-dusty/50 opacity-70 hover:opacity-100";
          galeriaContenedor.innerHTML += `
            <button type="button" onclick="cambiarFotoDetalle('${url}', ${i})" class="btn-miniatura relative aspect-square w-20 md:w-24 shrink-0 overflow-hidden rounded-xl bg-dusty/20 transition-all ${clasesEstado}" aria-label="Ver foto ${i + 1}">
              <img src="${url}" class="h-full w-full object-cover">
            </button>`;
        });
      }

      const divMapa = document.getElementById('contenedor-mapa-cliente');
      if (prod.lat && prod.lng) {
        divMapa.classList.remove('hidden');
        setTimeout(() => {
          if(!mapaCliente) {
            mapaCliente = L.map('mapa-cliente').setView([prod.lat, prod.lng], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapaCliente);
            markerCliente = L.marker([prod.lat, prod.lng]).addTo(mapaCliente);
          } else {
            mapaCliente.setView([prod.lat, prod.lng], 16);
            if(markerCliente) mapaCliente.removeLayer(markerCliente);
            markerCliente = L.marker([prod.lat, prod.lng]).addTo(mapaCliente);
          }
          mapaCliente.invalidateSize();
        }, 100);
      } else { divMapa.classList.add('hidden'); }
    }

    window.cerrarDetalle = function() {
      document.getElementById('vista-detalle').classList.add('hidden');
      document.getElementById('vista-detalle').classList.remove('block');
      document.getElementById('seccion-principal').classList.remove('hidden');
    }

    cargarDatos();
  </script>
</body>
</html>
