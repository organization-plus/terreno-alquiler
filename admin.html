<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Estudio Jurídico</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Inter"', 'sans-serif'], }
        }
      }
    }
  </script>
  <style>
    .menu-activo { background-color: #111827; color: white; border-color: #111827; }
  </style>
</head>

<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col antialiased">

  <div id="admin-screen" class="flex flex-col min-h-screen">
    <nav class="bg-white py-4 px-6 md:px-12 flex flex-wrap justify-between items-center border-b border-gray-200 sticky top-0 z-40 gap-4 shadow-sm">
      <div class="text-xl font-bold tracking-tight">
        Hasan y asociados <span class="font-light text-gray-500">Admin</span>
      </div>
      <div class="flex flex-wrap gap-2 md:gap-3">
        <button onclick="abrirModalAnuncio()" class="bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs font-semibold py-2 px-4 rounded-full transition flex items-center gap-2">
          <i class="fa-solid fa-bullhorn"></i> <span class="hidden sm:inline">Anuncio</span>
        </button>
        <button onclick="abrirModalCategorias()" class="bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs font-semibold py-2 px-4 rounded-full transition flex items-center gap-2">
          <i class="fa-solid fa-tags"></i> <span class="hidden sm:inline">Categorías</span>
        </button>
        <button onclick="abrirModalNuevo()" class="bg-black hover:bg-gray-800 text-white text-xs font-semibold py-2 px-4 rounded-full transition shadow-md flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Nueva Propiedad</span>
        </button>
      </div>
    </nav>

    <main class="py-10 px-6 md:px-12 max-w-7xl mx-auto w-full">
      <div id="menu-categorias" class="flex flex-wrap justify-center gap-3 mb-10"></div>
      <h2 id="titulo-categoria" class="text-2xl font-bold capitalize mb-6 text-center">Todo</h2>
      <div id="grilla-admin" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </main>
  </div>

  <!-- Modal Nueva Propiedad -->
  <div id="modal-form" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50 transition-opacity overflow-y-auto py-10">
    <div class="bg-white rounded-2xl max-w-xl w-full p-8 shadow-2xl relative my-auto">
      <button onclick="cerrarModal()" class="absolute top-4 right-4 text-gray-400 hover:text-black transition bg-gray-100 rounded-full w-8 h-8 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      <h3 id="modal-titulo" class="text-2xl font-bold mb-6">Agregar Propiedad</h3>
      
      <form id="form-producto" class="flex flex-col gap-4">
        <input type="hidden" id="prod-id">
        
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Título de publicación</label>
          <input type="text" id="nombre" required placeholder="Ej: Lote en Barrio Cerrado" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl focus:border-black focus:ring-1 focus:ring-black outline-none transition">
        </div>

        <div class="flex gap-4">
          <div class="w-1/2">
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Categoría</label>
            <select id="categoria-select" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl focus:border-black outline-none transition"></select>
          </div>
          <div class="w-1/2">
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Precio</label>
            <div class="flex">
              <span class="inline-flex items-center px-4 bg-gray-100 border border-r-0 border-gray-200 text-gray-500 rounded-l-xl font-bold">$</span>
              <input type="text" id="precio" required placeholder="15.000" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-r-xl focus:border-black outline-none transition">
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Descripción</label>
          <textarea id="descripcion" required class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl focus:border-black outline-none transition break-words whitespace-pre-wrap" rows="3"></textarea>
        </div>

        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
          <label class="block text-xs font-bold text-gray-800 uppercase tracking-wide mb-2"><i class="fa-solid fa-map-location-dot"></i> Ubicación en el Mapa</label>
          <p class="text-xs text-gray-500 mb-2">Hacé clic en el mapa para colocar el marcador.</p>
          <div id="mapa-admin" class="w-full h-48 rounded-lg border border-gray-300 z-10"></div>
          <button type="button" onclick="limpiarUbicacion()" class="text-xs text-red-500 hover:text-red-700 mt-2 font-semibold"><i class="fa-solid fa-trash"></i> Quitar ubicación</button>
        </div>

        <div class="flex flex-col md:flex-row gap-4">
          <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 w-full">
            <label class="block text-xs font-bold text-gray-800 uppercase tracking-wide mb-2"><i class="fa-solid fa-image"></i> Foto de Portada</label>
            <input type="file" id="imagen-file" accept="image/*" class="w-full text-xs text-gray-500 file:mr-2 file:py-1 file:px-3 file:rounded-full file:border-0 file:bg-gray-200 file:text-black">
            <div id="preview-portada" class="mt-3 hidden">
              <img id="img-portada-actual" src="" class="w-16 h-16 object-cover rounded-lg shadow-sm border border-gray-200">
            </div>
          </div>
          <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 w-full">
            <label class="block text-xs font-bold text-gray-800 uppercase tracking-wide mb-1"><i class="fa-solid fa-images"></i> Galería (Extra)</label>
            <input type="file" id="galeria-files" accept="image/*" multiple class="w-full text-xs text-gray-500 file:mr-2 file:py-1 file:px-3 file:rounded-full file:border-0 file:bg-gray-200 file:text-black mb-2">
            <div id="galeria-actual-container" class="flex gap-2 flex-wrap"></div>
          </div>
        </div>

        <button type="submit" id="btn-guardar" class="bg-black hover:bg-gray-800 text-white font-bold py-4 rounded-xl mt-2 transition text-sm shadow-md">Guardar Propiedad</button>
      </form>
    </div>
  </div>

  <!-- Modal Gestor de Categorías -->
  <div id="modal-categorias" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50 transition-opacity">
    <div class="bg-white rounded-2xl max-w-md w-full p-8 shadow-2xl relative border border-gray-100">
      <button onclick="cerrarModalCategorias()" class="absolute top-4 right-4 text-gray-400 hover:text-black transition bg-gray-100 rounded-full w-8 h-8 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      <h3 class="text-2xl font-bold mb-4">Categorías</h3>
      <form id="form-nueva-cat" class="flex gap-2 mb-6">
        <input type="text" id="nueva-cat-nombre" placeholder="Ej: Terrenos, Casas..." required class="flex-1 bg-gray-50 border border-gray-200 text-black p-3 rounded-xl focus:border-black outline-none transition">
        <button type="submit" class="bg-black hover:bg-gray-800 text-white px-5 rounded-xl transition font-bold"><i class="fa-solid fa-plus"></i></button>
      </form>
      <div class="max-h-64 overflow-y-auto pr-2 no-scrollbar">
        <ul id="lista-gestion-categorias" class="flex flex-col gap-3"></ul>
      </div>
    </div>
  </div>

  <!-- Modal Anuncios -->
  <div id="modal-anuncio" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50 transition-opacity overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-lg w-full p-8 shadow-2xl relative border border-gray-100">
      <button onclick="cerrarModalAnuncio()" class="absolute top-4 right-4 text-gray-400 hover:text-black transition bg-gray-100 rounded-full w-8 h-8 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      <h3 class="text-2xl font-bold mb-6"><i class="fa-solid fa-bullhorn text-gray-400"></i> Anuncio Emergente</h3>
      
      <form id="form-anuncio" class="flex flex-col gap-4">
        <label class="flex items-center gap-3 bg-gray-50 p-4 rounded-xl border border-gray-200 cursor-pointer hover:border-black transition">
          <input type="checkbox" id="anuncio-activo" class="w-5 h-5 accent-black">
          <span class="text-sm font-bold text-gray-800">Mostrar este anuncio al entrar</span>
        </label>
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Título</label>
          <input type="text" id="anuncio-titulo" class="w-full bg-gray-50 border border-gray-200 text-black p-3 rounded-xl focus:border-black outline-none transition">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Mensaje</label>
          <textarea id="anuncio-texto" rows="4" class="w-full bg-gray-50 border border-gray-200 text-black p-3 rounded-xl focus:border-black outline-none transition break-words whitespace-pre-wrap"></textarea>
        </div>
        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
          <label class="block text-sm font-bold text-gray-800 uppercase tracking-wide mb-2"><i class="fa-solid fa-image"></i> Imagen de Fondo (Textura)</label>
          <input type="file" id="anuncio-imagen" accept="image/*" class="w-full text-xs text-gray-500 file:mr-2 file:py-1 file:px-3 file:rounded-full file:border-0 file:bg-gray-200 file:text-black">
          <div id="preview-anuncio-bg" class="mt-3 hidden">
            <div class="w-full h-24 rounded-lg overflow-hidden border border-gray-300 relative">
              <img id="img-anuncio-actual" src="" class="w-full h-full object-cover opacity-50">
            </div>
          </div>
        </div>
        <button type="submit" id="btn-guardar-anuncio" class="bg-black hover:bg-gray-800 text-white font-bold py-4 rounded-xl mt-2 transition shadow-md">Publicar Anuncio</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, updateDoc, doc, deleteDoc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAHEemfeOAbqn8zwcJIQMgPCWoj-rieWjo",
      authDomain: "tio-juanjo.firebaseapp.com",
      projectId: "tio-juanjo",
      storageBucket: "tio-juanjo.firebasestorage.app",
      messagingSenderId: "465060896072",
      appId: "1:465060896072:web:d96cafe70ef8afd56e677d",
      measurementId: "G-7W0HGSHTWG"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let productos = [];
    let categorias = [];
    let urlImagenActual = ""; 
    let galeriaActual = []; 
    let urlAnuncioActual = "";
    let mapaAdmin = null;
    let markerAdmin = null;
    let coordsGuardadas = null;

    iniciarAppAdmin();

    function iniciarAppAdmin() { inicializarCategorias().then(() => cargarProductos()); }

    async function inicializarCategorias() {
      const snap = await getDocs(collection(db, "categorias_inmuebles"));
      if (snap.empty) {
        const cats = ["Terrenos", "Alquileres", "Casas", "Locales"];
        for (let cat of cats) { await addDoc(collection(db, "categorias_inmuebles"), { nombre: cat, oculta: false }); }
      }
      await refrescarCategorias();
    }

    async function refrescarCategorias() {
      const snap = await getDocs(collection(db, "categorias_inmuebles"));
      categorias = []; snap.forEach(doc => { categorias.push({ id: doc.id, ...doc.data() }); });
      categorias.sort((a, b) => a.nombre.localeCompare(b.nombre)); 
      renderizarUI();
    }

    function renderizarUI() {
      const menu = document.getElementById("menu-categorias");
      const selectCat = document.getElementById("categoria-select");
      const listaGestion = document.getElementById("lista-gestion-categorias");
      
      menu.innerHTML = `<button onclick="filtrarAdmin('todos')" class="menu-btn menu-activo px-5 py-2 rounded-full border border-gray-200 text-sm font-medium transition hover:bg-gray-100">Todo</button>`;
      selectCat.innerHTML = ""; 
      listaGestion.innerHTML = "";
      
      categorias.forEach(cat => {
        menu.innerHTML += `<button onclick="filtrarAdmin('${cat.nombre}')" class="menu-btn px-5 py-2 rounded-full border border-gray-200 text-sm font-medium text-gray-600 transition hover:bg-gray-100">${cat.nombre}</button>`;
        selectCat.innerHTML += `<option value="${cat.nombre}">${cat.nombre}</option>`;
        
        const iconOjo = cat.oculta ? 'fa-eye-slash text-gray-400' : 'fa-eye text-green-500';
        listaGestion.innerHTML += `
          <li class="flex justify-between items-center bg-gray-50 p-3 rounded-xl border border-gray-200">
            <span class="${cat.oculta ? 'text-gray-400 line-through' : 'text-gray-800'} font-medium">${cat.nombre}</span>
            <div class="flex gap-4">
              <button onclick="toggleCategoria('${cat.id}', ${cat.oculta})" class="transition hover:scale-110"><i class="fa-solid ${iconOjo}"></i></button>
              <button onclick="borrarCategoria('${cat.id}')" class="text-red-500 hover:text-red-700 transition hover:scale-110"><i class="fa-solid fa-trash"></i></button>
            </div>
          </li>`;
      });
    }

    window.abrirModalCategorias = function() { document.getElementById("modal-categorias").classList.remove("hidden"); document.getElementById("modal-categorias").classList.add("flex");}
    window.cerrarModalCategorias = function() { document.getElementById("modal-categorias").classList.add("hidden"); document.getElementById("modal-categorias").classList.remove("flex");}
    
    document.getElementById('form-nueva-cat').addEventListener('submit', async (e) => {
      e.preventDefault(); const nombre = document.getElementById('nueva-cat-nombre').value.trim();
      await addDoc(collection(db, "categorias_inmuebles"), { nombre: nombre, oculta: false });
      document.getElementById('nueva-cat-nombre').value = ""; refrescarCategorias();
    });

    window.toggleCategoria = async function(id, estadoActual) { await updateDoc(doc(db, "categorias_inmuebles", id), { oculta: !estadoActual }); refrescarCategorias(); }
    window.borrarCategoria = async function(id) { if(confirm("¿Seguro que querés borrar esta categoría?")) { await deleteDoc(doc(db, "categorias_inmuebles", id)); refrescarCategorias(); } }

    async function cargarProductos() {
      const querySnapshot = await getDocs(collection(db, "inmuebles"));
      productos = []; querySnapshot.forEach((doc) => { productos.push({ id: doc.id, ...doc.data() }); });
      filtrarAdmin('todos');
    }

    window.togglePropiedad = async function(id, estadoActual) {
      await updateDoc(doc(db, "inmuebles", id), { oculta: !estadoActual });
      cargarProductos();
    }

    window.filtrarAdmin = function(cat) {
      document.querySelectorAll(".menu-btn").forEach(btn => btn.classList.remove("menu-activo"));
      const filtrados = cat === "todos" ? productos : productos.filter(p => p.categoria.toLowerCase() === cat.toLowerCase());
      const grilla = document.getElementById("grilla-admin"); grilla.innerHTML = "";

      filtrados.forEach(prod => {
        const badgeGaleria = (prod.galeria && prod.galeria.length > 0) ? `<div class="absolute top-2 right-2 bg-white text-black text-[10px] px-2 py-1 rounded-full shadow font-bold"><i class="fa-solid fa-images"></i> +${prod.galeria.length}</div>` : '';
        
        const opacityCard = prod.oculta ? 'opacity-50 grayscale-[50%]' : '';
        const iconOjoProd = prod.oculta ? 'fa-eye-slash text-gray-400' : 'fa-eye text-green-600';
        const titleToggle = prod.oculta ? 'Mostrar al público' : 'Ocultar al público';

        grilla.innerHTML += `
          <div class="bg-white p-4 rounded-2xl border border-gray-100 flex flex-col shadow-sm transition ${opacityCard}">
            <div class="w-full aspect-[4/3] overflow-hidden mb-3 bg-gray-100 rounded-xl relative">
              <img src="${prod.imagen}" class="w-full h-full object-cover">
              ${badgeGaleria}
            </div>
            <p class="text-gray-400 text-[10px] uppercase font-bold tracking-widest">${prod.categoria}</p>
            <h3 class="text-lg font-bold mb-1 leading-tight">${prod.nombre}</h3>
            <p class="text-gray-900 font-bold mb-3">$ ${prod.precio || '-'}</p>
            <div class="mt-auto flex gap-2 border-t border-gray-100 pt-3">
              <button onclick="togglePropiedad('${prod.id}', ${prod.oculta || false})" class="w-10 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg transition flex items-center justify-center" title="${titleToggle}"><i class="fa-solid ${iconOjoProd}"></i></button>
              <button onclick="editarProducto('${prod.id}')" class="flex-1 bg-gray-100 hover:bg-gray-200 text-black text-xs py-2 rounded-lg transition font-medium">Editar</button>
              <button onclick="borrarProducto('${prod.id}')" class="flex-1 bg-red-50 hover:bg-red-100 text-red-600 text-xs py-2 rounded-lg transition font-medium">Borrar</button>
            </div>
          </div>
        `;
      });
    }

    function initMapaAdmin(lat, lng) {
      if(!mapaAdmin) {
        mapaAdmin = L.map('mapa-admin').setView([-27.367083, -55.896083], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapaAdmin);
        mapaAdmin.on('click', function(e) {
          if(markerAdmin) mapaAdmin.removeLayer(markerAdmin);
          markerAdmin = L.marker(e.latlng).addTo(mapaAdmin);
          coordsGuardadas = { lat: e.latlng.lat, lng: e.latlng.lng };
        });
      }
      if(markerAdmin) { mapaAdmin.removeLayer(markerAdmin); coordsGuardadas = null; }
      if(lat && lng) {
        mapaAdmin.setView([lat, lng], 15);
        markerAdmin = L.marker([lat, lng]).addTo(mapaAdmin);
        coordsGuardadas = { lat: lat, lng: lng };
      } else { mapaAdmin.setView([-27.367083, -55.896083], 12); }
      setTimeout(() => { mapaAdmin.invalidateSize(); }, 300);
    }

    window.limpiarUbicacion = function() {
      if(markerAdmin && mapaAdmin) { mapaAdmin.removeLayer(markerAdmin); }
      coordsGuardadas = null;
    }

    // --- LA MAGIA DE MANDALAS ADAPTADA PARA INMUEBLES (4:3) ---
    const comprimirImagen = (archivo) => {
      return new Promise((resolve) => {
        const reader = new FileReader(); 
        reader.readAsDataURL(archivo);
        reader.onload = (event) => {
          const img = new Image(); 
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Recorte forzado a formato horizontal (4:3) ideal para casas y terrenos
            const anchoObjetivo = 800;
            const altoObjetivo = 600;
            canvas.width = anchoObjetivo;
            canvas.height = altoObjetivo;

            const ratioObjetivo = anchoObjetivo / altoObjetivo;
            const ratioImagen = img.width / img.height;
            let sx, sy, sWidth, sHeight;

            if (ratioImagen > ratioObjetivo) {
              sHeight = img.height;
              sWidth = sHeight * ratioObjetivo;
              sx = (img.width - sWidth) / 2;
              sy = 0;
            } else {
              sWidth = img.width;
              sHeight = sWidth / ratioObjetivo;
              sx = 0;
              sy = (img.height - sHeight) / 2;
            }

            ctx.drawImage(img, sx, sy, sWidth, sHeight, 0, 0, anchoObjetivo, altoObjetivo);
            
            // Conversión y compresión a WebP 75%
            canvas.toBlob((blob) => { 
              const nuevoNombre = archivo.name.replace(/\.[^/.]+$/, "") + ".webp";
              resolve(new File([blob], nuevoNombre, { type: 'image/webp' })); 
            }, 'image/webp', 0.75); 
          };
        };
      });
    };

    // --- CONEXIÓN DIRECTA A TU NUEVO CLOUDINARY ---
    async function subirACloudinary(archivo) {
      const formData = new FormData();
      formData.append('file', archivo);
      formData.append('upload_preset', 'estudio-juridico'); 

      const response = await fetch('https://api.cloudinary.com/v1_1/ml_estudiojuridico/image/upload', {
        method: 'POST',
        body: formData
      });

      const data = await response.json();
      if (data.secure_url) { return data.secure_url; } 
      else { throw new Error('Cloudinary rechazó la imagen. Revisá haber creado el upload_preset "estudio-juridico".'); }
    }

    window.abrirModalNuevo = function() {
      document.getElementById('form-producto').reset();
      document.getElementById('imagen-file').value = ""; document.getElementById('galeria-files').value = "";
      document.getElementById('prod-id').value = "";
      document.getElementById('modal-titulo').innerText = "Nueva Propiedad";
      document.getElementById('preview-portada').classList.add('hidden');
      document.getElementById("modal-form").classList.remove("hidden");
      document.getElementById("modal-form").classList.add("flex");
      document.getElementById('imagen-file').required = true;
      galeriaActual = []; renderizarGaleriaActual();
      initMapaAdmin(null, null);
    }

    window.editarProducto = function(id) {
      const prod = productos.find(p => p.id === id);
      document.getElementById('prod-id').value = prod.id;
      document.getElementById('nombre').value = prod.nombre;
      document.getElementById('precio').value = prod.precio || "";
      document.getElementById('categoria-select').value = prod.categoria;
      document.getElementById('descripcion').value = prod.descripcion;
      urlImagenActual = prod.imagen; 
      
      document.getElementById('imagen-file').value = ""; document.getElementById('galeria-files').value = "";
      document.getElementById('preview-portada').classList.remove('hidden');
      document.getElementById('img-portada-actual').src = prod.imagen;
      
      galeriaActual = prod.galeria || []; renderizarGaleriaActual();
      document.getElementById('modal-titulo').innerText = "Editar Propiedad";
      document.getElementById('imagen-file').required = false; 
      document.getElementById("modal-form").classList.remove("hidden");
      document.getElementById("modal-form").classList.add("flex");
      
      initMapaAdmin(prod.lat, prod.lng);
    }

    window.renderizarGaleriaActual = function() {
      const container = document.getElementById('galeria-actual-container'); container.innerHTML = "";
      if (galeriaActual.length > 0) {
        galeriaActual.forEach((url, index) => {
          container.innerHTML += `
            <div class="relative w-16 h-16 rounded-lg overflow-hidden border border-gray-200 shadow-sm">
              <img src="${url}" class="w-full h-full object-cover">
              <button type="button" onclick="eliminarFotoGaleria(${index})" class="absolute inset-0 bg-white/80 text-red-500 flex items-center justify-center transition opacity-0 hover:opacity-100"><i class="fa-solid fa-trash text-xs"></i></button>
            </div>`;
        });
      }
    }

    window.eliminarFotoGaleria = function(index) { galeriaActual.splice(index, 1); renderizarGaleriaActual(); }
    window.cerrarModal = function() { document.getElementById("modal-form").classList.add("hidden"); document.getElementById("modal-form").classList.remove("flex"); }
    window.borrarProducto = async function(id) { if(confirm("¿Borrar propiedad?")) { await deleteDoc(doc(db, "inmuebles", id)); cargarProductos(); } }

    document.getElementById('form-producto').addEventListener('submit', async (e) => {
      e.preventDefault();
      const boton = document.getElementById('btn-guardar'); const originalText = boton.innerHTML; boton.disabled = true;
      try {
        const id = document.getElementById('prod-id').value;
        const archivoFoto = document.getElementById('imagen-file').files[0];
        const archivosGaleria = document.getElementById('galeria-files').files;
        let urlFinal = urlImagenActual; 

        if (archivoFoto) {
          boton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Subiendo portada...';
          const fotoComprimida = await comprimirImagen(archivoFoto); 
          urlFinal = await subirACloudinary(fotoComprimida);
        }

        let nuevasUrlsGaleria = [];
        if (archivosGaleria.length > 0) {
          for (let i = 0; i < archivosGaleria.length; i++) {
            boton.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Fotos extra (${i+1}/${archivosGaleria.length})...`;
            const fotoCom = await comprimirImagen(archivosGaleria[i]); 
            const urlGaleria = await subirACloudinary(fotoCom);
            nuevasUrlsGaleria.push(urlGaleria);
          }
        }
        
        const galeriaFinal = [...galeriaActual, ...nuevasUrlsGaleria];
        
        const prodExistente = productos.find(p => p.id === id);
        const estabaOculta = prodExistente ? prodExistente.oculta : false;

        const datosProducto = { 
          nombre: document.getElementById('nombre').value, 
          precio: document.getElementById('precio').value, 
          categoria: document.getElementById('categoria-select').value, 
          descripcion: document.getElementById('descripcion').value, 
          imagen: urlFinal, 
          galeria: galeriaFinal,
          oculta: estabaOculta,
          lat: coordsGuardadas ? coordsGuardadas.lat : null, 
          lng: coordsGuardadas ? coordsGuardadas.lng : null  
        };

        boton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando datos...';
        if (id) { await updateDoc(doc(db, "inmuebles", id), datosProducto); } else { await addDoc(collection(db, "inmuebles"), datosProducto); }
        cerrarModal(); cargarProductos(); 
      } catch (error) { alert("Error: " + error.message); } finally { boton.innerHTML = originalText; boton.disabled = false; }
    });

    window.abrirModalAnuncio = async function() {
      document.getElementById("modal-anuncio").classList.remove("hidden");
      document.getElementById("modal-anuncio").classList.add("flex");
      try {
        const docSnap = await getDoc(doc(db, "configuracion_inmuebles", "anuncio"));
        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById('anuncio-activo').checked = data.activo || false;
          document.getElementById('anuncio-titulo').value = data.titulo || "";
          document.getElementById('anuncio-texto').value = data.texto || "";
          urlAnuncioActual = data.imagen || "";
          if(urlAnuncioActual) {
            document.getElementById('preview-anuncio-bg').classList.remove('hidden');
            document.getElementById('img-anuncio-actual').src = urlAnuncioActual;
          }
        }
      } catch(e) {}
    }
    window.cerrarModalAnuncio = function() { document.getElementById("modal-anuncio").classList.add("hidden"); document.getElementById("modal-anuncio").classList.remove("flex"); }

    document.getElementById('form-anuncio').addEventListener('submit', async (e) => {
      e.preventDefault(); const boton = document.getElementById('btn-guardar-anuncio'); const originalText = boton.innerHTML; boton.disabled = true;
      try {
        const archivoFoto = document.getElementById('anuncio-imagen').files[0]; let urlFinal = urlAnuncioActual; 
        if (archivoFoto) {
          boton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Subiendo fondo...';
          const fotoComprimida = await comprimirImagen(archivoFoto); 
          urlFinal = await subirACloudinary(fotoComprimida);
        }
        boton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando...';
        await setDoc(doc(db, "configuracion_inmuebles", "anuncio"), {
          activo: document.getElementById('anuncio-activo').checked, titulo: document.getElementById('anuncio-titulo').value, texto: document.getElementById('anuncio-texto').value, imagen: urlFinal
        });
        cerrarModalAnuncio(); alert("Anuncio actualizado.");
      } catch (error) {} finally { boton.innerHTML = originalText; boton.disabled = false; }
    });
  </script>
</body>
</html>
